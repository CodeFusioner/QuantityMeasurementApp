# ============================================================
# UC18 - Spring Security: JWT + OAuth2
# ============================================================
spring.application.name=quantity-measurement-app

# ============================================================
# H2 Database
# ============================================================
spring.datasource.url=jdbc:h2:file:/app/data/quantitymeasurementdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
# JPA / Hibernate
# ============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# H2 Console (disabled in production)
# ============================================================
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
# Server
# ============================================================
server.port=${PORT:8080}

# ============================================================
# Logging
# ============================================================
logging.level.root=WARN
logging.level.com.app.quantitymeasurement=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# ============================================================
# Swagger / OpenAPI
# ============================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ============================================================
# Actuator
# ============================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ============================================================
# CORS Configuration
# ============================================================
allowed.origins=${ALLOWED_ORIGINS:https://quantity-measurement-app-frontend-one.vercel.app}

frontend.url=${FRONTEND_URL:https://quantity-measurement-app-frontend-one.vercel.app}

# ============================================================
# JWT Configuration
# ============================================================
jwt.secret=${JWT_SECRET:bXlTdXBlclNlY3JldEtleUZvckpXVFRoYXRJc0F0TGVhc3QyNTZCaXRzTG9uZw==}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ============================================================
# OAuth2 - Google
# ============================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri=${APP_URL:https://quantitymeasurementapp-jqtt.onrender.com}/login/oauth2/code/google

# ============================================================
# OAuth2 - GitHub
# ============================================================
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:YOUR_GITHUB_CLIENT_ID}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:YOUR_GITHUB_CLIENT_SECRET}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${APP_URL:https://quantitymeasurementapp-jqtt.onrender.com}/login/oauth2/code/github